<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parking Entry - Smart Recommendation</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    background:linear-gradient(135deg,#11998e,#38ef7d);
    min-height:100vh;
    padding:30px;
    font-family:'Segoe UI';
}

.card{
    border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
}

#video{
    width:100%;
    max-width:450px;
    border-radius:12px;
    border:3px solid #28a745;
}

.recommend-box{
    background:#f8f9fa;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
}

.form-check{
    padding:8px;
    border-radius:8px;
    transition:.2s;
}

.form-check:hover{
    background:#e9ecef;
}

.success-box{
    background:#d4edda;
    border-radius:12px;
    padding:15px;
}

.zone-badge{
    font-weight:bold;
}

.scanning-indicator{
    background:#28a745;
    color:white;
    padding:8px 15px;
    border-radius:8px;
    display:none;
    margin-top:10px;
}

.scanning-indicator.active{
    display:inline-block;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%, 100%{opacity:1;}
    50%{opacity:0.5;}
}
</style>
</head>

<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-md-9 col-lg-8">

<div class="card">

<div class="card-header bg-success text-white text-center">
<h4><i class="bi bi-box-arrow-in-right"></i> Parking Entry (Smart Slot Booking)</h4>
</div>

<div class="card-body">

<!-- ===== SLOT TIME SELECT ===== -->
<div class="recommend-box">
<h6 class="text-success mb-3">Select Parking Duration</h6>

<div class="form-check">
<input class="form-check-input" type="radio" name="duration" value="30" checked>
<label class="form-check-label">Short Stay (≤30 min) → Slots 1–15</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="duration" value="120">
<label class="form-check-label">Medium Stay (≤3 hrs) → Slots 16–40</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="duration" value="240">
<label class="form-check-label">Long Stay (>3 hrs) → Slots 41–50</label>
</div>
</div>


<!-- ===== CAMERA ===== -->
<div class="text-center mb-4">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<div class="mt-3">
<button class="btn btn-success me-2" onclick="startScan()" id="startBtn">
<i class="bi bi-camera"></i> Start Camera
</button>
<button class="btn btn-secondary" onclick="stopScan()" id="stopBtn" style="display:none;">
<i class="bi bi-stop-circle"></i> Stop
</button>
</div>

<div class="scanning-indicator" id="scanIndicator">
<i class="bi bi-camera-video"></i> Scanning for QR Code...
</div>
</div>


<!-- ===== MANUAL ===== -->
<div class="mb-3">
<label class="form-label">Manual QR Entry</label>
<div class="input-group">
<input type="text" id="manualQR" class="form-control" placeholder="Enter QR data">
<button class="btn btn-success" onclick="submitManualQR()">Submit</button>
</div>
</div>


<!-- ===== RESULT ===== -->
<div id="resultBox" class="success-box mt-4" style="display:none;">
<h5 class="text-success">Entry Successful ✅</h5>

<p><strong>Slot:</strong> <span id="slotNumber"></span></p>
<p><strong>Entry Time:</strong> <span id="entryTime"></span></p>
<p>
<strong>Zone:</strong>
<span id="zoneInfo" class="badge bg-primary zone-badge"></span>
</p>

<button class="btn btn-primary w-100" onclick="resetPage()">Next Vehicle</button>
</div>


<!-- ===== ERROR ===== -->
<div id="errorBox" class="alert alert-danger mt-3" style="display:none;"></div>

</div>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
let video, canvas, ctx, scanning = false;
let scanAnimationId = null;

function getDuration(){
    return document.querySelector('input[name="duration"]:checked').value;
}

function getZoneLabel(duration){
    if(duration <= 30) return "Short Stay (Slots 1–15)";
    if(duration <= 180) return "Medium Stay (Slots 16–40)";
    return "Long Stay (Slots 41–50)";
}

async function startScan(){
    video = document.getElementById("video");
    canvas = document.getElementById("canvas");
    ctx = canvas.getContext("2d");

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        });

        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
            video.play();
            scanning = true;
            
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("stopBtn").style.display = "inline-block";
            document.getElementById("scanIndicator").classList.add("active");
            
            scanLoop();
        };

    } catch(err) {
        console.error("Camera error:", err);
        showError("Camera access denied. Please allow camera permission or use manual entry.");
    }
}

function stopScan(){
    scanning = false;
    
    if(scanAnimationId){
        cancelAnimationFrame(scanAnimationId);
        scanAnimationId = null;
    }
    
    if(video && video.srcObject){
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
    }
    
    document.getElementById("startBtn").style.display = "inline-block";
    document.getElementById("stopBtn").style.display = "none";
    document.getElementById("scanIndicator").classList.remove("active");
}

function scanLoop(){
    if(!scanning) return;

    if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert"
        });

        if(code && code.data){
            console.log("QR Code detected:", code.data);
            stopScan();
            sendToBackend(code.data);
            return;
        }
    }

    scanAnimationId = requestAnimationFrame(scanLoop);
}

function submitManualQR(){
    const qr = document.getElementById("manualQR").value.trim();
    if(!qr) {
        showError("Please enter QR data");
        return;
    }
    sendToBackend(qr);
}

async function sendToBackend(qrData){
    const duration = getDuration();

    try {
        const res = await fetch("/api/entry", {
            method: "POST",
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                qr_data: qrData,
                duration: duration
            })
        });

        const data = await res.json();

        if(res.ok){
            document.getElementById("slotNumber").innerText = data.slot_number;
            document.getElementById("entryTime").innerText = data.entry_time;
            document.getElementById("zoneInfo").innerText = getZoneLabel(parseInt(duration));

            document.getElementById("resultBox").style.display = "block";
            document.getElementById("errorBox").style.display = "none";
        } else {
            showError(data.error);
        }
    } catch(err) {
        showError("Network error. Please try again.");
        console.error(err);
    }
}

function showError(msg){
    document.getElementById("errorBox").innerText = msg;
    document.getElementById("errorBox").style.display = "block";
    setTimeout(() => {
        document.getElementById("errorBox").style.display = "none";
    }, 5000);
}

function resetPage(){
    document.getElementById("manualQR").value = "";
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("errorBox").style.display = "none";
    stopScan();
}

// Clean up on page unload
window.addEventListener('beforeunload', stopScan);
</script>

</body>
</html>
