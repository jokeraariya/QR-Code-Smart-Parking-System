<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exit - QR Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        #video {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            border: 3px solid #dc3545;
        }
        .scanner-container {
            text-align: center;
            padding: 2rem;
        }
        .bill-details {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin-top: 1rem;
        }
        .scanning-indicator{
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            display: none;
            margin-top: 10px;
        }
        .scanning-indicator.active{
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse{
            0%, 100%{opacity:1;}
            50%{opacity:0.5;}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0"><i class="bi bi-box-arrow-right"></i> Parking Exit</h4>
                    </div>
                    <div class="card-body">
                        <div class="scanner-container">
                            <div id="scannerArea">
                                <video id="video" autoplay playsinline muted></video>
                                <canvas id="canvas" style="display: none;"></canvas>
                                
                                <div class="mt-3">
                                    <button class="btn btn-danger" onclick="startScan()" id="startBtn">
                                        <i class="bi bi-camera"></i> Start Camera
                                    </button>
                                    <button class="btn btn-secondary" onclick="stopScan()" style="display: none;" id="stopBtn">
                                        <i class="bi bi-stop-circle"></i> Stop Camera
                                    </button>
                                </div>

                                <div class="scanning-indicator" id="scanIndicator">
                                    <i class="bi bi-camera-video"></i> Scanning for QR Code...
                                </div>
                            </div>
                            
                            <div class="mt-4">
                                <p class="text-muted">Or enter QR code manually:</p>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="manualQR" placeholder="Enter QR code data">
                                    <button class="btn btn-danger" onclick="processManualQR()">
                                        <i class="bi bi-check-circle"></i> Submit
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div id="result" style="display: none;" class="mt-4">
                            <div class="alert alert-success">
                                <h5><i class="bi bi-check-circle-fill"></i> Exit Successful!</h5>
                            </div>
                            <div class="bill-details">
                                <h6 class="mb-3">Parking Details</h6>
                                <p><strong>Slot Number:</strong> <span id="slotNumber"></span></p>
                                <p><strong>Entry Time:</strong> <span id="entryTime"></span></p>
                                <p><strong>Exit Time:</strong> <span id="exitTime"></span></p>
                                <p><strong>Duration:</strong> <span id="duration"></span> minutes</p>
                                <hr>
                                <h5 class="text-danger">Total Fee: ₹<span id="fee"></span></h5>
                            </div>
                            <button class="btn btn-primary w-100 mt-3" onclick="resetExit()">
                                <i class="bi bi-arrow-clockwise"></i> Scan Another
                            </button>
                        </div>

                        <div id="errorMsg" class="alert alert-danger mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        let video, canvas, context, scanning = false;
        let scanAnimationId = null;

        async function startScan() {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            context = canvas.getContext('2d');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });

                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    video.play();
                    scanning = true;

                    document.getElementById('startBtn').style.display = 'none';
                    document.getElementById('stopBtn').style.display = 'inline-block';
                    document.getElementById('scanIndicator').classList.add('active');

                    scanQR();
                };

            } catch(err) {
                console.error('Camera error:', err);
                showError('Camera access denied. Please allow camera permission or use manual entry.');
            }
        }

        function stopScan() {
            scanning = false;

            if(scanAnimationId){
                cancelAnimationFrame(scanAnimationId);
                scanAnimationId = null;
            }

            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }

            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('scanIndicator').classList.remove('active');
        }

        function scanQR() {
            if (!scanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert"
                });

                if (code && code.data) {
                    console.log("QR Code detected:", code.data);
                    stopScan();
                    processQR(code.data);
                    return;
                }
            }
            
            scanAnimationId = requestAnimationFrame(scanQR);
        }

        function processManualQR() {
            const qrData = document.getElementById('manualQR').value.trim();
            if (qrData) {
                processQR(qrData);
            } else {
                showError('Please enter QR code data');
            }
        }

        async function processQR(qrData) {
            stopScan();
            
            try {
                const response = await fetch('/api/exit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ qr_data: qrData })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('slotNumber').textContent = data.slot_number;
                    document.getElementById('entryTime').textContent = data.entry_time;
                    document.getElementById('exitTime').textContent = data.exit_time;
                    document.getElementById('duration').textContent = data.duration_minutes;
                    document.getElementById('fee').textContent = data.fee.toFixed(2);
                    document.getElementById('errorMsg').style.display = 'none';
                    document.getElementById('manualQR').value = '';
                } else {
                    showError(data.error || 'Exit failed');
                    document.getElementById('result').style.display = 'none';
                }
            } catch (error) {
                showError('Network error. Please try again.');
                console.error(error);
            }
        }

        function showError(msg){
            document.getElementById('errorMsg').textContent = msg;
            document.getElementById('errorMsg').style.display = 'block';
            setTimeout(() => {
                document.getElementById('errorMsg').style.display = 'none';
            }, 5000);
        }

        function resetExit() {
            document.getElementById('result').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('manualQR').value = '';
            stopScan();
        }

        // Clean up on page unload
        window.addEventListener('beforeunload', stopScan);
    </script>
</body>
</html>
